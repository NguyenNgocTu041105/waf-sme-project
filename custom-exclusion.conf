# 1. Declarative False Positive Exclusion for Legitimate WebSocket Polling
# Rule 920420: Request content-type not allowed for /socket.io/
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:1000,phase:1,pass,nolog,ctl:ruleRemoveById=920420"

# 2. Active Rate Limiting Enforcement Directives (Nginx + ModSecurity)
# Enforces CIA Availability by mitigating automated DoS Request Flood
limit_req_zone $binary_remote_addr zone=waf_rate_limit:10m rate=1r/s;
limit_req zone=waf_rate_limit burst=10 nodelay;
limit_req_status 429;
