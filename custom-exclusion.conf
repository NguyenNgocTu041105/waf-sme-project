# 1. Khac phuc False Positive cho Socket.io Long-Polling
# Rule 920272: Multiple URL encodings detected
# Rule 942100: SQL Injection attack detected via libinjection
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:100001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920272,\
    ctl:ruleRemoveById=942100"

# 2. Khac phuc False Positive cho endpoint /rest/continue-code/
# Cho phep truyen ma hash continue session cua Juice Shop
SecRule REQUEST_URI "@beginsWith /rest/continue-code/" \
    "id:100002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=942100"
